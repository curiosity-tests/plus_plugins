  android_integration_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        android-api-level: [24, 29, 32, 36]

    steps:
    - name: "Checkout repository"
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: flutter-actions/setup-flutter@v4
    - name: "Install Tools"
      run: ./.github/workflows/scripts/install-tools.sh
    - name: "Bootstrap Workspace"
      run: melos bootstrap --scope="$PLUGIN_SCOPE"

    - name: "Android Integration Test"
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.android-api-level }}
        target: google_apis
        arch: x86_64
        force-avd-creation: false
        profile: pixel_7_pro
        script: ./.github/workflows/scripts/integration-test.sh android sensors_plus_example

